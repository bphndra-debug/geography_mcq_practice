<style>
:root{--bg:#0f172a;--card:#1e293b;--card2:#172033;--border:#334155;--text:#f8fafc;--muted:#94a3b8;--accent:#6366f1;--green:#10b981;--red:#ef4444;--amber:#f59e0b}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px;display:flex;justify-content:center}button,input{font:inherit}button{touch-action:manipulation}.app{width:100%;max-width:820px}.card{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:20px;box-shadow:0 20px 40px rgba(0,0,0,.3)}
.top{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;border-bottom:1px solid var(--border);padding-bottom:15px}.eyebrow{font-size:.7rem;font-weight:850;letter-spacing:.08em;text-transform:uppercase;color:#818cf8}h1{font-size:1.18rem;margin:4px 0}.progress{font-size:.88rem;color:var(--muted)}.score{font-size:.8rem;color:#6ee7b7;font-weight:750;margin-top:4px}.controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.jump{width:68px;padding:8px;border:1px solid var(--border);border-radius:8px;background:#0b1220;color:#c7d2fe;text-align:center}.btn{border:0;border-radius:8px;padding:9px 12px;font-weight:750;font-size:.82rem;cursor:pointer;background:#334155;color:#e2e8f0;transition:.15s;min-height:40px}.btn:hover{filter:brightness(1.12)}.btn:disabled{opacity:.45;cursor:not-allowed}.primary{background:#4f46e5;color:#fff}.success{background:#059669;color:#fff}.danger{background:#991b1b;color:#fff}
.bar{height:5px;background:#0b1220;border-radius:99px;overflow:hidden;margin-top:12px}.bar>span{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}.main{padding-top:20px}.hidden{display:none!important}.loading{text-align:center;padding:30px;color:var(--muted)}.error{padding:16px;border:1px solid #7f1d1d;background:#450a0a;color:#fecaca;border-radius:10px;line-height:1.6}.question{font-size:1.08rem;line-height:1.6;font-weight:560;margin-bottom:17px}.qnum{color:#818cf8;font-weight:850;margin-right:8px}.question img{display:block;max-width:100%;height:auto;margin:15px auto;border:1px solid var(--border);border-radius:9px;background:#fff}.question img.map-image{max-height:390px;object-fit:contain}.instruction{font-size:.78rem;color:var(--muted);margin:-7px 0 13px;font-weight:650}
.options{display:flex;flex-direction:column;gap:9px}.opt{width:100%;display:flex;align-items:flex-start;gap:10px;text-align:left;padding:13px 14px;border:1px solid var(--border);border-radius:10px;background:#1e293b;color:var(--text);cursor:pointer;line-height:1.45}.opt:hover:not(.locked){background:#293548}.opt.selected{border-color:#818cf8;background:#312e81}.opt.correct{border-color:var(--green);background:#064e3b;color:#a7f3d0}.opt.wrong{border-color:var(--red);background:#7f1d1d;color:#fecaca}.optkey{width:26px;flex:0 0 26px;font-weight:850;color:#a5b4fc}.correct .optkey{color:#6ee7b7}.wrong .optkey{color:#fca5a5}
.special-block{margin:0 0 16px;background:var(--card2);border:1px solid var(--border);border-radius:11px;overflow:hidden}.special-title{padding:10px 13px;background:#25334a;color:#a5b4fc;font-size:.78rem;font-weight:850;text-transform:uppercase;letter-spacing:.04em}.statement-list{padding:0}.statement{display:grid;grid-template-columns:38px 1fr;gap:8px;padding:11px 13px;border-top:1px solid var(--border);line-height:1.5}.statement-key{font-weight:850;color:#818cf8}.statement-text{color:var(--text)}
.matching-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:0 0 16px}.match-panel{background:var(--card2);border:1px solid var(--border);border-radius:10px;overflow:hidden}.match-head{padding:10px 13px;background:#25334a;color:#a5b4fc;font-weight:850;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}.match-row{display:grid;grid-template-columns:34px 1fr;gap:8px;padding:10px 13px;border-top:1px solid var(--border);line-height:1.45}.match-key{font-weight:850;color:#818cf8}.match-value{color:var(--text)}
.pair-list{margin:0 0 16px;background:var(--card2);border:1px solid var(--border);border-radius:11px;overflow:hidden}.pair-head,.pair-row{display:grid;grid-template-columns:42px 1fr 1fr;gap:10px;align-items:start}.pair-head{padding:10px 13px;background:#25334a;color:#c7d2fe;font-size:.78rem;font-weight:850}.pair-row{padding:11px 13px;border-top:1px solid var(--border);line-height:1.45}.pair-num{font-weight:850;color:#818cf8}.pair-value{color:var(--text)}.order-list{display:flex;flex-direction:column;gap:8px;margin:0 0 16px}.order-item{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;background:var(--card2);border:1px solid var(--border);border-radius:9px}.order-key{font-weight:850;color:#818cf8;min-width:28px}.order-text{line-height:1.45}.table-wrap{overflow:auto;margin-top:12px}.data-table{width:100%;border-collapse:collapse;font-size:.86rem;min-width:440px}.data-table th,.data-table td{border:1px solid var(--border);padding:8px 9px;text-align:left;vertical-align:top;line-height:1.4}.data-table th{background:#25334a;color:#c7d2fe;font-weight:800}.data-table td{background:#172033}
.footer{display:flex;gap:9px;margin-top:18px}.footer .prev{width:32%}.footer .submit{width:68%}.explanation{margin-top:18px;padding:16px;border:1px solid var(--border);border-radius:10px;background:#0b1220}.status{font-size:1.05rem;font-weight:850;margin-bottom:8px}.correct-text{color:#6ee7b7}.wrong-text{color:#fca5a5}.exp-title{font-size:.7rem;text-transform:uppercase;color:var(--muted);font-weight:850;margin-bottom:5px}.exp-body{color:#cbd5e1;line-height:1.65;font-size:.92rem}.explanation img{display:block;max-width:100%;height:auto;margin:12px auto;border-radius:8px}.explanation .next{margin-top:9px}
.result{text-align:center;padding:8px 0}.result-score{font-size:2.6rem;font-weight:900;color:#a5b4fc;margin:8px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.stat{background:#0b1220;border:1px solid var(--border);border-radius:9px;padding:12px}.stat b{display:block;font-size:1.25rem}.stat span{font-size:.72rem;color:var(--muted)}.result-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.hint{font-size:.75rem;color:var(--muted);margin-top:9px}.source{font-size:.7rem;color:#64748b;margin-top:12px;text-align:right}
@media(max-width:620px){.pair-head,.pair-row{grid-template-columns:32px 1fr 1fr;gap:7px}.pair-head{font-size:.72rem}.pair-row{padding:10px 9px}}@media(max-width:620px){body{padding:7px}.card{padding:14px;border-radius:11px}.top{flex-direction:column}.controls{justify-content:flex-start;width:100%}.question{font-size:1rem}.matching-grid{grid-template-columns:1fr;gap:9px}.footer{position:sticky;bottom:0;background:linear-gradient(transparent,var(--card) 25%);padding-top:14px}.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:9px}.data-table{min-width:390px}}
.question img.question-image{max-height:520px;object-fit:contain}
.image-error{margin:12px 0;padding:12px;border:1px dashed #f59e0b;border-radius:8px;background:#451a03;color:#fde68a;font-size:.82rem;line-height:1.45}
.explanation-images{margin-top:12px}
.chapter-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}.chapter-card{display:block;width:100%;padding:16px;text-align:left;background:var(--card2);border:1px solid var(--border);border-radius:11px;color:var(--text);cursor:pointer;transition:.15s}.chapter-card:hover{border-color:#818cf8;background:#202b40;transform:translateY(-1px)}.chapter-number{font-size:.7rem;color:#818cf8;font-weight:850;text-transform:uppercase;letter-spacing:.06em}.chapter-title{font-size:1rem;font-weight:800;margin-top:5px}.chapter-count{font-size:.78rem;color:var(--muted);margin-top:6px}.chapter-back{margin-bottom:14px}.quiz-title{font-size:1.18rem;font-weight:800;margin:4px 0}.home-btn{margin-bottom:14px}@media(max-width:620px){.chapter-list{grid-template-columns:1fr}}
</style>

<body>
<div class="app"><div class="card">
<header class="top">
  <div>
    <div class="eyebrow">Interactive Practice</div>
    <div id="quiz-title" class="quiz-title">Indian Geography — MCQ Practice</div>
    <div id="progress" class="progress">Loading questions…</div>
    <div id="score-display" class="score">Score: 0 | Answered: 0</div>
    <div class="bar"><span id="progress-bar"></span></div>
  </div>
  <div class="controls">
    <label for="jump-input" class="hint">Jump</label>
    <input id="jump-input" class="jump" type="number" min="1" inputmode="numeric" aria-label="Question number">
    <button id="jump-btn" class="btn primary">Go</button>
    <button id="reset-btn" class="btn">Reset</button>
  </div>
</header>
<main id="main" class="main">
  <section id="chapter-box">
    <div class="eyebrow">Choose a Chapter</div>
    <h2 id="chapter-heading">Indian Geography</h2>
    <div id="chapter-list" class="chapter-list">
      <div class="loading">Loading chapters…</div>
    </div>
  </section>

  <section id="quiz-box" class="hidden">
  <button id="chapter-back" class="btn home-btn">← Chapters</button>
  <div id="question-container"><div class="loading">Loading question bank…</div></div>
  <div id="options-container" class="options"></div>
  <div id="footer" class="footer">
    <button id="prev-btn" class="btn prev">← Previous</button>
    <button id="submit-btn" class="btn primary submit" disabled>Submit Answer</button>
  </div>
  <section id="explanation-box" class="explanation hidden" aria-live="polite">
    <div id="result-status" class="status"></div>
    <div class="exp-title">Explanation</div>
    <div id="explanation-text" class="exp-body"></div>
    <div id="explanation-blocks"></div>
    <button id="next-btn" class="btn success next">Next Question →</button>
  </section>
  <section id="result-box" class="result hidden" aria-live="polite">
    <div class="eyebrow">Test Complete</div><div id="result-score" class="result-score">0%</div>
    <div class="stats"><div class="stat"><b id="result-correct">0</b><span>Correct</span></div><div class="stat"><b id="result-wrong">0</b><span>Wrong</span></div><div class="stat"><b id="result-unanswered">0</b><span>Unanswered</span></div></div>
    <div class="result-actions"><button id="review-wrong" class="btn danger">Review Wrong Answers</button><button id="restart-btn" class="btn primary">Restart</button></div>
  </section>
  </section>
</main>
</div></div>
<script>
'use strict';
const CHAPTERS_FILE='chapters.json';
let activeChapter=null,questions=[],currentIndex=0,selectedOption=null,userAnswers={},reviewMode=false,reviewIndexes=[];
let STORAGE_ANSWERS='',STORAGE_INDEX='';
const $=id=>document.getElementById(id);
const key=v=>String(v??'').trim().toLowerCase();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function validateQuestions(data){
  if(!data||typeof data!=='object'||!Array.isArray(data.questions))throw new Error('The structured JSON must contain a "questions" array.');
  if(!data.questions.length)throw new Error('The question bank is empty.');
  const ids=new Set();
  data.questions.forEach((q,i)=>{
    if(!q||typeof q!=='object')throw new Error(`Question ${i+1}: invalid record.`);
    if(q.id==null)throw new Error(`Question ${i+1}: missing id.`);
    if(ids.has(String(q.id)))throw new Error(`Duplicate question id: ${q.id}.`);ids.add(String(q.id));
    if(!q.question)throw new Error(`Question ${q.id}: missing question text.`);
    if(!Array.isArray(q.options)||!q.options.length)throw new Error(`Question ${q.id}: missing options.`);
    if(!q.options.some(o=>key(o.id)===key(q.correct)))throw new Error(`Question ${q.id}: correct answer "${q.correct}" does not match an option.`);
    q.options.forEach(o=>{if(o.id==null||o.text==null)throw new Error(`Question ${q.id}: invalid option.`)});
  });
}
async function fetchJson(file){
  const r=await fetch(file,{cache:'no-store'});
  if(!r.ok)throw new Error(`Could not load ${file} (HTTP ${r.status}).`);
  try{return JSON.parse(await r.text())}
  catch(e){throw new Error(`${file} contains invalid JSON: ${e.message}`)}
}

async function loadChapters(){
  const data=await fetchJson(CHAPTERS_FILE);
  if(!data||!Array.isArray(data.chapters)||!data.chapters.length)throw new Error('chapters.json must contain a non-empty "chapters" array.');
  return data;
}

async function startChapter(chapter){
  activeChapter=chapter;
  STORAGE_ANSWERS=`indian_geo_answers_${chapter.id}_v4`;
  STORAGE_INDEX=`indian_geo_index_${chapter.id}_v4`;

  $('chapter-box').classList.add('hidden');
  $('quiz-box').classList.remove('hidden');
  $('quiz-title').textContent=chapter.title;
  $('progress').textContent='Loading questions…';
  $('score-display').textContent='Score: 0 | Answered: 0';

  try{
    const data=await fetchJson(chapter.file);
    validateQuestions(data);
    questions=data.questions;
    currentIndex=0;
    selectedOption=null;
    userAnswers={};
    reviewMode=false;
    reviewIndexes=[];
    restore();
    loadQuestion();
  }catch(e){
    fatal(e);
  }
}

function showChapters(data){
  const list=$('chapter-list');
  list.innerHTML='';
  data.chapters.forEach((chapter,i)=>{
    const b=document.createElement('button');
    b.type='button';
    b.className='chapter-card';
    b.innerHTML=`<div class="chapter-number">Chapter ${i+1}</div>
      <div class="chapter-title">${esc(chapter.title)}</div>
      <div class="chapter-count">${Number(chapter.questions)||'Multiple'} questions</div>`;
    b.addEventListener('click',()=>startChapter(chapter));
    list.appendChild(b);
  });
}

function save(){try{localStorage.setItem(STORAGE_ANSWERS,JSON.stringify(userAnswers));localStorage.setItem(STORAGE_INDEX,String(currentIndex))}catch(e){}}
function restore(){try{const a=JSON.parse(localStorage.getItem(STORAGE_ANSWERS)||'{}');userAnswers=a&&typeof a==='object'?a:{};const i=parseInt(localStorage.getItem(STORAGE_INDEX)||'0',10);if(Number.isInteger(i)&&i>=0&&i<questions.length)currentIndex=i}catch(e){userAnswers={};currentIndex=0}}
function stats(){let correct=0,wrong=0,answered=0;questions.forEach(q=>{const a=userAnswers[String(q.id)];if(a){answered++;key(a)===key(q.correct)?correct++:wrong++}});return{correct,wrong,answered,unanswered:questions.length-answered}}
function updateScore(){const s=stats();$('score-display').textContent=`Score: ${s.correct} | Answered: ${s.answered}`;$('progress-bar').style.width=`${s.answered/questions.length*100}%`}

function addTitle(text){const d=document.createElement('div');d.className='special-title';d.textContent=text;return d}
function renderStatements(q){
  if(!Array.isArray(q.statements))return;
  const block=document.createElement('div');block.className='special-block';block.appendChild(addTitle(q.type==='assertion_statement'?'Statements':'Statements to evaluate'));
  const list=document.createElement('div');list.className='statement-list';
  q.statements.forEach(s=>{const row=document.createElement('div');row.className='statement';row.innerHTML=`<div class="statement-key">${esc(s.id)}</div><div class="statement-text">${esc(s.text)}</div>`;list.appendChild(row)});
  block.appendChild(list);$('question-container').appendChild(block);
}
function renderMatching(q){
  const m=q.matching;if(!m)return;const grid=document.createElement('div');grid.className='matching-grid';
  const panel=(title,items)=>{const p=document.createElement('div');p.className='match-panel';p.appendChild(addTitle(title));items.forEach(x=>{const r=document.createElement('div');r.className='match-row';r.innerHTML=`<div class="match-key">${esc(x.id)}.</div><div class="match-value">${esc(x.text)}</div>`;p.appendChild(r)});return p};
  grid.appendChild(panel(m.left_label,m.left));grid.appendChild(panel(m.right_label,m.right));$('question-container').appendChild(grid);
}
function renderOrdering(q){
  if(!Array.isArray(q.items))return;const list=document.createElement('div');list.className='order-list';q.items.forEach(x=>{const r=document.createElement('div');r.className='order-item';r.innerHTML=`<div class="order-key">${esc(x.id)}</div><div class="order-text">${esc(x.text)}</div>`;list.appendChild(r)});$('question-container').appendChild(list);if(q.ordering_instruction){const d=document.createElement('div');d.className='instruction';d.textContent=q.ordering_instruction;$('question-container').appendChild(d)}}
function renderPairs(q){
  if(!Array.isArray(q.pairs)||!q.pairs.length)return;
  const wrap=document.createElement('div');
  wrap.className='pair-list';
  const head=document.createElement('div');
  head.className='pair-head';
  head.innerHTML='<div>No.</div><div>Peak</div><div>Mountains</div>';
  wrap.appendChild(head);
  q.pairs.forEach(x=>{
    const row=document.createElement('div');
    row.className='pair-row';
    row.innerHTML=`<div class="pair-num">${esc(x.id)}.</div><div class="pair-value">${esc(x.left)}</div><div class="pair-value">${esc(x.right)}</div>`;
    wrap.appendChild(row);
  });
  $('question-container').appendChild(wrap);
}
function renderBlocks(q){
  const holder=$('explanation-blocks');holder.innerHTML='';if(!Array.isArray(q.explanation_blocks))return;
  q.explanation_blocks.forEach(b=>{if(b.type!=='table')return;const wrap=document.createElement('div');wrap.className='table-wrap';const t=document.createElement('table');t.className='data-table';if(b.columns){const thead=document.createElement('thead'),tr=document.createElement('tr');b.columns.forEach(c=>{const th=document.createElement('th');th.textContent=c;tr.appendChild(th)});thead.appendChild(tr);t.appendChild(thead)}const tb=document.createElement('tbody');(b.rows||[]).forEach(row=>{const tr=document.createElement('tr');row.forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});tb.appendChild(tr)});t.appendChild(tb);wrap.appendChild(t);holder.appendChild(wrap)})
}
function createQuestionContent(q){
  const box=$('question-container');
  box.innerHTML='';

  const p=document.createElement('div');
  p.className='question';
  p.innerHTML=`<span class="qnum">${esc(q.id)}.</span> ${esc(q.question)}`;
  box.appendChild(p);

  if(q.type==='statement_combination'||q.type==='assertion_statement') renderStatements(q);
  if(q.type==='matching') renderMatching(q);
  if(q.type==='ordering') renderOrdering(q);
  if(q.type==='pair_selection') renderPairs(q);

  if(q.type==='pair_selection'){
    const d=document.createElement('div');
    d.className='instruction';
    d.textContent=q.instruction||'Select the correct option.';
    box.appendChild(d);
  }

  // Render q.image for ANY question type.
  if(q.image){
    const img=document.createElement('img');
    img.className='question-image' + (q.type==='map_based'?' map-image':'');
    img.src=q.image;
    img.alt='Image referred to in the question';
    img.loading='lazy';
    img.onerror=()=>{
      const err=document.createElement('div');
      err.className='image-error';
      err.textContent=`Image could not be loaded: ${q.image}`;
      img.replaceWith(err);
    };
    box.appendChild(img);
  }

  if(q.type==='statement_combination'&&q.option_set==='includes_none_or_more_than_one'){
    const d=document.createElement('div');
    d.className='hint';
    d.textContent='This question uses the PDF’s “None of the above / More than one of the above” style.';
    box.appendChild(d);
  }

  if(q.source_page){
    const d=document.createElement('div');
    d.className='source';
    d.textContent=`Source PDF page ${q.source_page}`;
    box.appendChild(d);
  }

  renderMath(box);
}

function showOptions(q){
  const c=$('options-container');c.innerHTML='';const previous=userAnswers[String(q.id)];const answered=Boolean(previous);
  q.options.forEach(o=>{const b=document.createElement('button');b.type='button';b.className='opt';b.setAttribute('aria-label',`Option ${o.id}: ${o.text}`);if(answered){b.classList.add('locked');if(key(o.id)===key(q.correct))b.classList.add('correct');if(key(o.id)===key(previous)&&key(previous)!==key(q.correct))b.classList.add('wrong')}else b.addEventListener('click',()=>selectOption(o.id,b));b.innerHTML=`<span class="optkey">${esc(o.id)})</span><span>${esc(o.text)}</span>`;c.appendChild(b)})
renderMath(c);}
function loadQuestion(){
  if(!questions.length)return;if(reviewMode&&!reviewIndexes.includes(currentIndex))currentIndex=reviewIndexes[0];const q=questions[currentIndex];selectedOption=null;save();
  $('progress').textContent=reviewMode?`Review • ${reviewIndexes.indexOf(currentIndex)+1} of ${reviewIndexes.length}`:`Question ${currentIndex+1} of ${questions.length}`;$('jump-input').value=currentIndex+1;$('jump-input').max=questions.length;
  $('prev-btn').disabled=reviewMode?reviewIndexes.indexOf(currentIndex)<=0:currentIndex===0;createQuestionContent(q);showOptions(q);
  const answered=Boolean(userAnswers[String(q.id)]);$('submit-btn').classList.toggle('hidden',answered);$('submit-btn').disabled=true;$('explanation-box').classList.toggle('hidden',!answered);$('result-box').classList.add('hidden');
  if(answered)showExplanation(userAnswers[String(q.id)],q);updateScore();window.scrollTo({top:0,behavior:'smooth'})
}
function selectOption(o,b){const q=questions[currentIndex];if(userAnswers[String(q.id)])return;selectedOption=o;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('submit-btn').disabled=false}
function checkAnswer(){const q=questions[currentIndex];if(!selectedOption||userAnswers[String(q.id)])return;userAnswers[String(q.id)]=selectedOption;save();loadQuestion()}
function showExplanation(answer,q){
  const ok=key(answer)===key(q.correct);
  $('result-status').className=`status ${ok?'correct-text':'wrong-text'}`;
  $('result-status').textContent=ok?'✓ Correct!':`✗ Incorrect • Correct answer: ${String(q.correct).toUpperCase()}`;

  $('explanation-text').textContent=q.explanation||'No explanation provided.';
  renderBlocks(q);

  const holder=$('explanation-blocks');

  if(Array.isArray(q.explanation_images) && q.explanation_images.length){
    const imageHolder=document.createElement('div');
    imageHolder.className='explanation-images';

    q.explanation_images.forEach(src=>{
      const img=document.createElement('img');
      img.src=src;
      img.alt='Explanation image';
      img.loading='lazy';
      img.onerror=()=>{
        const err=document.createElement('div');
        err.className='image-error';
        err.textContent=`Image could not be loaded: ${src}`;
        img.replaceWith(err);
      };
      imageHolder.appendChild(img);
    });

    holder.appendChild(imageHolder);
  }

  renderMath($('explanation-box'));
}

function nextQuestion(){if(reviewMode){const p=reviewIndexes.indexOf(currentIndex);if(p>=0&&p<reviewIndexes.length-1){currentIndex=reviewIndexes[p+1];loadQuestion()}else showResults();return}if(currentIndex<questions.length-1){currentIndex++;loadQuestion()}else showResults()}
function previousQuestion(){if(reviewMode){const p=reviewIndexes.indexOf(currentIndex);if(p>0){currentIndex=reviewIndexes[p-1];loadQuestion()}}else if(currentIndex>0){currentIndex--;loadQuestion()}}
function jumpToQuestion(){const n=parseInt($('jump-input').value,10);if(!Number.isInteger(n)||n<1||n>questions.length){alert(`Please enter a number between 1 and ${questions.length}.`);return}reviewMode=false;currentIndex=n-1;$('footer').classList.remove('hidden');$('prev-btn').classList.remove('hidden');loadQuestion()}
function showResults(){const s=stats();$('question-container').innerHTML='';$('options-container').innerHTML='';$('footer').classList.add('hidden');$('explanation-box').classList.add('hidden');$('result-box').classList.remove('hidden');$('progress').textContent='Test completed';$('result-score').textContent=`${Math.round(s.correct/questions.length*100)}%`;$('result-correct').textContent=s.correct;$('result-wrong').textContent=s.wrong;$('result-unanswered').textContent=s.unanswered;$('progress-bar').style.width=`${s.answered/questions.length*100}%`}
function reviewWrong(){reviewIndexes=questions.map((q,i)=>({q,i})).filter(x=>userAnswers[String(x.q.id)]&&key(userAnswers[String(x.q.id)])!==key(x.q.correct)).map(x=>x.i);if(!reviewIndexes.length){alert('There are no wrong answers to review.');return}reviewMode=true;currentIndex=reviewIndexes[0];$('result-box').classList.add('hidden');$('footer').classList.remove('hidden');$('submit-btn').classList.add('hidden');loadQuestion()}
function restart(){if(!confirm('Restart and clear all saved answers?'))return;userAnswers={};currentIndex=0;reviewMode=false;reviewIndexes=[];try{localStorage.removeItem(STORAGE_ANSWERS);localStorage.removeItem(STORAGE_INDEX)}catch(e){}$('result-box').classList.add('hidden');$('footer').classList.remove('hidden');$('prev-btn').classList.remove('hidden');loadQuestion()}
function fatal(e){console.error(e);$('progress').textContent='Failed to load';$('score-display').textContent='';$('options-container').innerHTML='';$('footer').classList.add('hidden');$('explanation-box').classList.add('hidden');$('question-container').innerHTML=`<div class="error"><strong>Cannot load questions.</strong><br><br>${esc(e.message)}<br><br>Make sure the selected chapter JSON and <code>chapters.json</code> are in the correct repository paths.</div>`}
function renderMath(root){
  if(!root || typeof renderMathInElement!=='function') return;
  try{
    renderMathInElement(root,{
      delimiters:[
        {left:'$$',right:'$$',display:true},
        {left:'\\[',right:'\\]',display:true},
        {left:'\\(',right:'\\)',display:false},
        {left:'$',right:'$',display:false}
      ],
      throwOnError:false,
      strict:false
    });
  }catch(e){
    console.warn('KaTeX rendering failed:',e);
  }
}

async function init(){
  try{
    const data=await loadChapters();
    showChapters(data);
  }catch(e){
    console.error(e);
    $('chapter-list').innerHTML=`<div class="error"><strong>Cannot load chapters.</strong><br><br>${esc(e.message)}<br><br>Make sure <code>chapters.json</code> is in the same folder as this HTML file.</div>`;
  }
}

function goHome(){
  $('quiz-box').classList.add('hidden');
  $('chapter-box').classList.remove('hidden');
  $('result-box').classList.add('hidden');
  $('footer').classList.remove('hidden');
  $('prev-btn').classList.remove('hidden');
  activeChapter=null;
  questions=[];
  currentIndex=0;
  selectedOption=null;
  userAnswers={};
  reviewMode=false;
  reviewIndexes=[];
  $('quiz-title').textContent='Indian Geography — MCQ Practice';
  $('progress').textContent='Choose a chapter';
  $('score-display').textContent='Score: 0 | Answered: 0';
  $('progress-bar').style.width='0%';
  window.scrollTo({top:0,behavior:'smooth'});
}

$('chapter-back').addEventListener('click',goHome);$('jump-btn').addEventListener('click',jumpToQuestion);$('jump-input').addEventListener('keydown',e=>{if(e.key==='Enter')jumpToQuestion()});$('reset-btn').addEventListener('click',restart);$('prev-btn').addEventListener('click',previousQuestion);$('submit-btn').addEventListener('click',checkAnswer);$('next-btn').addEventListener('click',nextQuestion);$('review-wrong').addEventListener('click',reviewWrong);$('restart-btn').addEventListener('click',restart);document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(e.key==='ArrowLeft')previousQuestion();if(e.key==='ArrowRight'&&!$('submit-btn').disabled)checkAnswer()});window.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
