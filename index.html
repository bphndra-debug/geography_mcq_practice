<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geograpy MCQ Practice App</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- KaTeX for rendering mathematical equations -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" onload="initApp();"></script>

  <style>
    /* Styling for embedded HTML tables inside JSON questions */
    .mcq-table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0;
      font-size: 0.875rem;
      background-color: #0f172a; /* Slate 900 */
      border-radius: 0.5rem;
      overflow: hidden;
      border: 1px solid #334155; /* Slate 700 */
    }
    .mcq-table th, .mcq-table td {
      border: 1px solid #334155;
      padding: 0.5rem 0.75rem;
      text-align: center;
    }
    .mcq-table th {
      background-color: #1e293b; /* Slate 800 */
      color: #818cf8; /* Indigo 400 */
      font-weight: 600;
    }
    /* Styling for diagram images */
    .q-image-container {
      text-align: center;
      margin: 1rem 0;
    }
    .q-image-container img {
      max-width: 100%;
      height: auto;
      border-radius: 0.5rem;
      border: 1px solid #334155;
      margin: 0 auto;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="max-w-2xl w-full bg-slate-800 border border-slate-700 rounded-xl shadow-2xl p-6 relative">
    
    <!-- Top Progress Bar & Jump Control -->
    <div class="flex flex-wrap justify-between items-center mb-6 pb-4 border-b border-slate-700 gap-2">
      <div>
        <span class="text-xs font-semibold text-indigo-400 uppercase tracking-wide block">Interactive Practice</span>
        <span id="progress" class="text-sm font-medium text-slate-400">Loading questions...</span>
        <span id="score-display" class="text-xs text-emerald-400 block mt-1">Score: 0 | Answered: 0</span>
      </div>

      <!-- Jump To Question Feature -->
      <div class="flex items-center space-x-2">
        <label for="jump-input" class="text-xs text-slate-400 font-medium">Jump to:</label>
        <input id="jump-input" type="number" min="1" placeholder="#" class="w-16 px-2 py-1 bg-slate-900 border border-slate-700 rounded text-center text-sm font-semibold text-indigo-300 focus:outline-none focus:border-indigo-500" onkeydown="handleJumpKey(event)">
        <button onclick="jumpToQuestion()" class="px-3 py-1 bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold text-white rounded transition">Go</button>
        <button onclick="resetProgress()" class="px-3 py-1 bg-slate-700 hover:bg-slate-600 text-xs font-semibold text-slate-200 rounded transition">Reset</button>
      </div>
    </div>

    <!-- Active Question -->
    <div id="question-container" class="text-lg font-medium mb-6 leading-relaxed"></div>

    <!-- Options Container -->
    <div id="options-container" class="space-y-3 mb-6"></div>

    <!-- Submit Button -->
    <div class="flex gap-2">
      <button id="prev-btn" onclick="previousQuestion()" class="w-1/3 py-3 bg-slate-700 hover:bg-slate-600 text-white font-semibold rounded-lg transition duration-200">← Previous</button>
      <button id="submit-btn" onclick="checkAnswer()" disabled class="w-2/3 py-3 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold rounded-lg transition duration-200">Submit Answer</button>
    </div>

    <!-- Solution Reveal Box -->
    <div id="explanation-box" class="hidden mt-6 p-4 rounded-lg bg-slate-900 border border-slate-700">
      <div id="result-status" class="text-lg font-bold mb-2"></div>
      <p class="text-xs uppercase text-slate-400 font-bold tracking-wider mb-1">Hints & Solution:</p>
      <div id="explanation-text" class="text-slate-300 text-sm leading-relaxed mb-4"></div>
      
      <button onclick="nextQuestion()" class="w-full sm:w-auto px-6 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-lg transition duration-200">
        Next Question →
      </button>
    </div>

  </div>

  <script>
    let questions = [];
    let currentIndex = 0;
    let selectedOption = null;
    let score = Number(localStorage.getItem('mcq_score') || 0);
    let answeredCount = Number(localStorage.getItem('mcq_answered') || 0);
    let hasAnsweredCurrent = false;

    const katexConfig = {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false},
        {left: '\\(', right: '\\)', display: false},
        {left: '\\[', right: '\\]', display: true}
      ],
      throwOnError: false
    };

    async function initApp() {
      try {
        const response = await fetch('quiz_data.json', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();

        if (Array.isArray(data)) {
          questions = data;
        } else if (data.sections) {
          let questionsList = [];
          let solutionsMap = {};

          data.sections.forEach(section => {
            if (section.questions) {
              questionsList = section.questions;
            } else if (section.section_type === "HINTS AND SOLUTIONS" && section.solutions) {
              section.solutions.forEach(sol => {
                solutionsMap[sol.question_number] = {
                  correct: sol.correct_option || 'a',
                  explanation: sol.explanation || 'No detailed solution provided.'
                };
              });
            }
          });

          questions = questionsList.map(q => {
            const qNum = q.question_number;
            const sol = solutionsMap[qNum] || { correct: 'a', explanation: 'No detailed explanation provided.' };

            return {
              id: qNum,
              question: q.question,
              image: q.image || null,
              options: q.options || {},
              correct: sol.correct,
              explanation: sol.explanation
            };
          });
        }

        if (questions.length > 0) {
          // Restore last saved question position if available
          const savedIndex = localStorage.getItem('mcq_last_index');
          if (savedIndex !== null) {
            const idx = parseInt(savedIndex, 10);
            if (!isNaN(idx) && idx >= 0 && idx < questions.length) {
              currentIndex = idx;
            }
          }
          loadQuestion();
        } else {
          document.getElementById('question-container').innerText = "No questions found in quiz_data.json.";
        }
      } catch (err) {
        document.getElementById('question-container').innerText = "Failed to load questions. Ensure quiz_data.json is in the root directory.";
      }
    }

    function renderMathIn(element) {
      if (window.renderMathInElement && element) {
        renderMathInElement(element, katexConfig);
      }
    }

    function loadQuestion() {
      const q = questions[currentIndex];
      selectedOption = null;
      hasAnsweredCurrent = false;

      // Save current question index to LocalStorage
      localStorage.setItem('mcq_last_index', currentIndex);

      document.getElementById('progress').innerText = `Question ${currentIndex + 1} of ${questions.length}`;
      document.getElementById('score-display').innerText = `Score: ${score} | Answered: ${answeredCount}`;
      document.getElementById('jump-input').max = questions.length;
      document.getElementById('prev-btn').disabled = currentIndex === 0;
      document.getElementById('prev-btn').classList.toggle('opacity-50', currentIndex === 0);
      document.getElementById('jump-input').value = currentIndex + 1;
      
      const qContainer = document.getElementById('question-container');
      
      // Build Question Content
      let qHtml = `<span class="font-bold text-indigo-400 mr-2">${q.id}.</span>${q.question}`;
      
      // Render Diagram Image if present in JSON (e.g. Q573)
      if (q.image) {
        qHtml += `<div class="q-image-container">
                    <img src="${q.image}" alt="Diagram for Q${q.id}" />
                  </div>`;
      }

      qContainer.innerHTML = qHtml;
      
      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';

      Object.entries(q.options).forEach(([key, val]) => {
        const btn = document.createElement('button');
        btn.className = `w-full text-left p-3 rounded-lg border border-slate-700 bg-slate-800 hover:bg-slate-700/50 transition flex items-center space-x-3 option-btn`;
        btn.onclick = () => selectOption(key, btn);
        btn.innerHTML = `<span class="font-bold text-indigo-400 uppercase w-6">${key})</span> <span class="option-content">${val}</span>`;
        optionsContainer.appendChild(btn);
      });

      document.getElementById('submit-btn').disabled = true;
      document.getElementById('submit-btn').classList.remove('hidden');
      document.getElementById('explanation-box').classList.add('hidden');

      renderMathIn(document.body);
    }

    function selectOption(key, element) {
      selectedOption = key;
      document.querySelectorAll('.option-btn').forEach(btn => {
        btn.classList.remove('border-indigo-500', 'bg-indigo-950/40');
      });
      element.classList.add('border-indigo-500', 'bg-indigo-950/40');
      document.getElementById('submit-btn').disabled = false;
    }

    function checkAnswer() {
      const q = questions[currentIndex];
      if (hasAnsweredCurrent) return;
      const isCorrect = selectedOption === q.correct;
      hasAnsweredCurrent = true;
      answeredCount++;
      if (isCorrect) score++;
      localStorage.setItem('mcq_score', score);
      localStorage.setItem('mcq_answered', answeredCount);
      document.getElementById('score-display').innerText = `Score: ${score} | Answered: ${answeredCount}`;

      document.getElementById('submit-btn').classList.add('hidden');
      const statusEl = document.getElementById('result-status');
      
      if (isCorrect) {
        statusEl.innerText = "✓ Correct!";
        statusEl.className = "text-lg font-bold mb-2 text-emerald-400";
      } else {
        statusEl.innerText = `✗ Incorrect (Correct Answer: ${q.correct.toUpperCase()})`;
        statusEl.className = "text-lg font-bold mb-2 text-rose-400";
      }

      const expBox = document.getElementById('explanation-text');
      expBox.innerHTML = q.explanation;
      document.getElementById('explanation-box').classList.remove('hidden');

      renderMathIn(document.getElementById('explanation-box'));
    }

    function nextQuestion() {
      if (currentIndex + 1 < questions.length) {
        currentIndex++;
        loadQuestion();
      } else {
        alert("Congratulations! You have completed all questions in this test set.");
      }
    }

    function previousQuestion() {
      if (currentIndex > 0) { currentIndex--; loadQuestion(); }
    }

    function resetProgress() {
      if (confirm('Reset score and saved position?')) {
        localStorage.removeItem('mcq_last_index');
        localStorage.removeItem('mcq_score');
        localStorage.removeItem('mcq_answered');
        score = 0; answeredCount = 0; currentIndex = 0; loadQuestion();
      }
    }

    function jumpToQuestion() {
      const inputVal = parseInt(document.getElementById('jump-input').value, 10);
      if (!isNaN(inputVal) && inputVal >= 1 && inputVal <= questions.length) {
        currentIndex = inputVal - 1;
        loadQuestion();
      } else {
        alert(`Please enter a question number between 1 and ${questions.length}.`);
      }
    }

    function handleJumpKey(event) {
      if (event.key === 'Enter') {
        jumpToQuestion();
      }
    }
  </script>
</body>
</html>
