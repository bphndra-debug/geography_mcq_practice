<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Geography MCQ Practice</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <style>
    :root {
      --bg:#0f172a; --card:#1e293b; --card2:#172033; --border:#334155;
      --text:#f8fafc; --muted:#94a3b8; --indigo:#6366f1; --green:#10b981;
      --red:#ef4444; --amber:#f59e0b;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0; background:var(--bg); color:var(--text);
      min-height:100vh; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      padding:16px; display:flex; justify-content:center;
    }
    button,input{font:inherit}
    button{touch-action:manipulation}
    .app{width:100%;max-width:760px}
    .card{
      background:var(--card); border:1px solid var(--border); border-radius:14px;
      padding:20px; box-shadow:0 20px 35px rgba(0,0,0,.35);
    }
    .top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border-bottom:1px solid var(--border);padding-bottom:16px}
    .eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#818cf8}
    h1{font-size:1.15rem;margin:4px 0 3px}
    .progress{font-size:.9rem;color:var(--muted)}
    .score{font-size:.8rem;color:#6ee7b7;font-weight:700;margin-top:4px}
    .controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
    .jump{width:64px;padding:8px;border:1px solid var(--border);border-radius:7px;background:#0b1220;color:#c7d2fe;text-align:center}
    .btn{
      border:0;border-radius:8px;padding:9px 12px;font-weight:700;font-size:.82rem;cursor:pointer;
      background:#334155;color:#e2e8f0;transition:.15s;min-height:40px
    }
    .btn:hover{filter:brightness(1.12)} .btn:disabled{opacity:.45;cursor:not-allowed}
    .primary{background:#4f46e5;color:#fff}.success{background:#059669;color:#fff}.danger{background:#991b1b;color:#fff}
    .main{padding-top:20px}
    .question{font-size:1.08rem;line-height:1.65;font-weight:550;margin-bottom:18px}
    .qnum{color:#818cf8;font-weight:800;margin-right:8px}
    .question img,.explanation img{display:block;max-width:100%;height:auto;margin:14px auto;border:1px solid var(--border);border-radius:9px}
    .options{display:flex;flex-direction:column;gap:10px}
    .opt{
      width:100%;display:flex;align-items:flex-start;gap:10px;text-align:left;padding:13px 14px;
      border:1px solid var(--border);border-radius:10px;background:#1e293b;color:var(--text);cursor:pointer;
      line-height:1.45
    }
    .opt:hover:not(.locked){background:#293548}.opt.selected{border-color:#818cf8;background:#312e81}
    .opt.correct{border-color:var(--green);background:#064e3b;color:#a7f3d0}
    .opt.wrong{border-color:var(--red);background:#7f1d1d;color:#fecaca}
    .optkey{width:24px;flex:0 0 24px;font-weight:800;color:#a5b4fc}.correct .optkey{color:#6ee7b7}.wrong .optkey{color:#fca5a5}
    .footer{display:flex;gap:9px;margin-top:18px}.footer .prev{width:32%}.footer .submit{width:68%}
    .explanation{margin-top:18px;padding:16px;border:1px solid var(--border);border-radius:10px;background:#0b1220}
    .status{font-size:1.05rem;font-weight:800;margin-bottom:8px}.correct-text{color:#6ee7b7}.wrong-text{color:#fca5a5}
    .exp-title{font-size:.72rem;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:5px}
    .exp-body{color:#cbd5e1;line-height:1.65;font-size:.92rem}
    .explanation .next{margin-top:8px}
    .error{padding:16px;border:1px solid #7f1d1d;background:#450a0a;color:#fecaca;border-radius:10px;line-height:1.6}
    .loading{padding:30px;text-align:center;color:var(--muted)}
    .hidden{display:none!important}
    .bar{height:5px;background:#0b1220;border-radius:99px;overflow:hidden;margin-top:14px}
    .bar>span{display:block;height:100%;background:#6366f1;width:0;transition:width .2s}
    .result{text-align:center;padding:8px 0}
    .result-score{font-size:2.5rem;font-weight:900;color:#a5b4fc;margin:8px 0}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
    .stat{background:#0b1220;border:1px solid var(--border);border-radius:9px;padding:12px}.stat b{display:block;font-size:1.25rem}.stat span{font-size:.72rem;color:var(--muted)}
    .result-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
    .hint{font-size:.76rem;color:var(--muted);margin-top:10px}

    .matching-question{margin-bottom:18px}
    .matching-intro{font-size:1.08rem;line-height:1.65;font-weight:550;margin-bottom:16px}
    .matching-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 0 18px}
    .match-panel{background:#172033;border:1px solid var(--border);border-radius:10px;overflow:hidden}
    .match-head{padding:10px 13px;background:#25334a;color:#a5b4fc;font-weight:800;font-size:.85rem;text-transform:uppercase;letter-spacing:.04em}
    .match-row{display:grid;grid-template-columns:38px 1fr;gap:8px;padding:10px 13px;border-top:1px solid var(--border);line-height:1.45}
    .match-key{font-weight:800;color:#818cf8}
    .match-value{color:var(--text)}
    .match-code{font-weight:800;color:#c7d2fe}
    .match-options-title{font-size:.75rem;text-transform:uppercase;color:var(--muted);font-weight:800;margin:4px 0 9px}
    @media(max-width:600px){
      .matching-grid{grid-template-columns:1fr;gap:10px}
      .matching-intro{font-size:1rem}
      .match-row{padding:9px 11px}
    }
    @media(max-width:600px){
      body{padding:8px}.card{padding:14px;border-radius:11px}.top{flex-direction:column}.controls{justify-content:flex-start;width:100%}
      .question{font-size:1rem}.footer{position:sticky;bottom:0;background:linear-gradient(transparent,var(--card) 25%);padding-top:14px}
      .stats{grid-template-columns:1fr 1fr 1fr}.stat{padding:9px}
    }
  </style>
</head>
<body>
<div class="app">
  <div class="card">
    <header class="top">
      <div>
        <div class="eyebrow">Interactive Practice</div>
        <h1>Geography MCQ Practice</h1>
        <div id="progress" class="progress">Loading questions…</div>
        <div id="score-display" class="score">Score: 0 | Answered: 0</div>
        <div class="bar"><span id="progress-bar"></span></div>
      </div>
      <div class="controls">
        <label for="jump-input" class="hint">Jump</label>
        <input id="jump-input" class="jump" type="number" min="1" inputmode="numeric" aria-label="Question number">
        <button id="jump-btn" class="btn primary">Go</button>
        <button id="reset-btn" class="btn">Reset</button>
      </div>
    </header>

    <main id="main" class="main">
      <div id="question-container" class="question"><div class="loading">Loading question bank…</div></div>
      <div id="options-container" class="options"></div>

      <div class="footer">
        <button id="prev-btn" class="btn prev">← Previous</button>
        <button id="submit-btn" class="btn primary submit" disabled>Submit Answer</button>
      </div>

      <section id="explanation-box" class="explanation hidden" aria-live="polite">
        <div id="result-status" class="status"></div>
        <div class="exp-title">Hints & Solution</div>
        <div id="explanation-text" class="exp-body"></div>
        <div id="explanation-images"></div>
        <button id="next-btn" class="btn success next">Next Question →</button>
      </section>

      <section id="result-box" class="result hidden" aria-live="polite">
        <div class="eyebrow">Test Complete</div>
        <div id="result-score" class="result-score">0%</div>
        <div class="stats">
          <div class="stat"><b id="result-correct">0</b><span>Correct</span></div>
          <div class="stat"><b id="result-wrong">0</b><span>Wrong</span></div>
          <div class="stat"><b id="result-unanswered">0</b><span>Unanswered</span></div>
        </div>
        <div class="result-actions">
          <button id="review-wrong" class="btn danger">Review Wrong Answers</button>
          <button id="restart-btn" class="btn primary">Restart</button>
        </div>
      </section>
    </main>
  </div>
</div>

<script>
'use strict';

const STORAGE_ANSWERS = 'mcq_user_answers_v2';
const STORAGE_INDEX = 'mcq_last_index_v2';

let questions = [];
let currentIndex = 0;
let selectedOption = null;
let userAnswers = {};
let reviewMode = false;
let reviewIndexes = [];

const $ = id => document.getElementById(id);

function normalizeKey(v) {
  return String(v ?? '').trim().toLowerCase();
}

function getKaTeXConfig() {
  const d = String.fromCharCode(36);
  return {
    delimiters: [
      {left:d+d,right:d+d,display:true},
      {left:d,right:d,display:false},
      {left:'\\(',right:'\\)',display:false},
      {left:'\\[',right:'\\]',display:true}
    ],
    throwOnError:false
  };
}

function renderMath() {
  if (window.renderMathInElement) {
    try { window.renderMathInElement(document.querySelector('.card'), getKaTeXConfig()); } catch(e) { console.warn('KaTeX:', e); }
  }
}

function validateQuestions(data) {
  if (!Array.isArray(data)) throw new Error('quiz_data.json must contain an array of questions.');
  if (!data.length) throw new Error('quiz_data.json contains no questions.');

  const ids = new Set();
  data.forEach((q, i) => {
    const n = i + 1;
    if (!q || typeof q !== 'object') throw new Error(`Question ${n}: invalid record.`);
    if (q.id === undefined || q.id === null || String(q.id).trim() === '') throw new Error(`Question ${n}: missing id.`);
    const id = String(q.id);
    if (ids.has(id)) throw new Error(`Duplicate question id: ${id}.`);
    ids.add(id);
    if (!q.question) throw new Error(`Question ${id}: missing question text.`);
    if (!q.options || typeof q.options !== 'object' || !Object.keys(q.options).length) throw new Error(`Question ${id}: missing options.`);
    if (!Object.keys(q.options).map(normalizeKey).includes(normalizeKey(q.correct))) {
      throw new Error(`Question ${id}: correct answer "${q.correct}" does not match an option.`);
    }
  });
}

async function loadJson() {
  const url = new URL('quiz_data.json', document.baseURI);
  const response = await fetch(url.href, {cache:'no-store'});
  if (!response.ok) throw new Error(`Could not load quiz_data.json (HTTP ${response.status}).`);
  const text = await response.text();
  try { return JSON.parse(text); }
  catch(e) { throw new Error(`quiz_data.json contains invalid JSON: ${e.message}`); }
}

function saveProgress() {
  try {
    localStorage.setItem(STORAGE_ANSWERS, JSON.stringify(userAnswers));
    localStorage.setItem(STORAGE_INDEX, String(currentIndex));
  } catch(e) { console.warn('Progress could not be saved:', e); }
}

function restoreProgress() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_ANSWERS) || '{}');
    userAnswers = saved && typeof saved === 'object' ? saved : {};
    const idx = parseInt(localStorage.getItem(STORAGE_INDEX) || '0', 10);
    if (Number.isInteger(idx) && idx >= 0 && idx < questions.length) currentIndex = idx;
  } catch(e) {
    userAnswers = {}; currentIndex = 0;
  }
}

function getStats() {
  let correct = 0, wrong = 0, answered = 0;
  questions.forEach(q => {
    const a = userAnswers[String(q.id)];
    if (a) {
      answered++;
      normalizeKey(a) === normalizeKey(q.correct) ? correct++ : wrong++;
    }
  });
  return {correct, wrong, answered, unanswered: questions.length - answered};
}

function updateScore() {
  const s = getStats();
  $('score-display').textContent = `Score: ${s.correct} | Answered: ${s.answered}`;
  $('progress-bar').style.width = `${(s.answered / questions.length) * 100}%`;
}

function createQuestionContent(q) {
  const box = $('question-container');
  box.innerHTML = '';

  // Render matching questions as two clean columns while keeping the
  // existing quiz_data.json format unchanged.
  if (/match\s+list-?i\b/i.test(String(q.question))) {
    const raw = String(q.question).replace(/\s+/g, ' ').trim();
    const listMarker = raw.match(/\bList-I(?:\s*\([^)]*\))?\s*:?\s*/i);
    const listIIIndex = raw.search(/\bList-II(?:\s*\([^)]*\))?\s*:?\s*/i);

    if (listMarker && listIIIndex > listMarker.index) {
      const intro = raw.slice(0, listMarker.index).trim();
      const leftStart = listMarker.index + listMarker[0].length;
      const leftText = raw.slice(leftStart, listIIIndex).trim();
      const rightMarker = raw.match(/\bList-II(?:\s*\([^)]*\))?\s*:?\s*/i);
      const rightStart = listIIIndex + rightMarker[0].length;
      const rightText = raw.slice(rightStart).replace(/\s+Code:\s*$/i, '').trim();

      const parseLetters = text => {
        const items = [];
        const re = /([A-Z])\.\s*(.*?)(?=\s+[A-Z]\.\s*|$)/g;
        let m;
        while ((m = re.exec(text)) !== null) items.push([m[1], m[2].trim()]);
        return items;
      };

      const parseNumbers = text => {
        const items = [];
        const re = /(\d+)\.\s*(.*?)(?=\s+\d+\.\s*|$)/g;
        let m;
        while ((m = re.exec(text)) !== null) items.push([m[1], m[2].trim()]);
        return items;
      };

      const leftItems = parseLetters(leftText);
      const rightItems = parseNumbers(rightText);

      if (leftItems.length && rightItems.length) {
        const wrap = document.createElement('div');
        wrap.className = 'matching-question';

        const introEl = document.createElement('div');
        introEl.className = 'matching-intro';
        introEl.innerHTML = `<span class="qnum">${String(q.id)}.</span> ${intro}`;
        wrap.appendChild(introEl);

        const grid = document.createElement('div');
        grid.className = 'matching-grid';

        const makePanel = (title, items, keyClass) => {
          const panel = document.createElement('div');
          panel.className = 'match-panel';

          const head = document.createElement('div');
          head.className = 'match-head';
          head.textContent = title;
          panel.appendChild(head);

          items.forEach(([key, value]) => {
            const row = document.createElement('div');
            row.className = 'match-row';

            const k = document.createElement('div');
            k.className = keyClass;
            k.textContent = key + '.';

            const v = document.createElement('div');
            v.className = 'match-value';
            v.innerHTML = value;

            row.appendChild(k);
            row.appendChild(v);
            panel.appendChild(row);
          });
          return panel;
        };

        grid.appendChild(makePanel('List-I', leftItems, 'match-key'));
        grid.appendChild(makePanel('List-II', rightItems, 'match-code'));
        wrap.appendChild(grid);

        const title = document.createElement('div');
        title.className = 'match-options-title';
        title.textContent = 'Choose the correct code';
        wrap.appendChild(title);

        box.appendChild(wrap);
      } else {
        const p = document.createElement('div');
        p.innerHTML = `<span class="qnum">${String(q.id)}.</span> ${q.question}`;
        box.appendChild(p);
      }
    } else {
      const p = document.createElement('div');
      p.innerHTML = `<span class="qnum">${String(q.id)}.</span> ${q.question}`;
      box.appendChild(p);
    }
  } else {
    const p = document.createElement('div');
    p.innerHTML = `<span class="qnum">${String(q.id)}.</span> ${q.question}`;
    box.appendChild(p);
  }

  if (q.image) {
    const img = document.createElement('img');
    img.src = q.image;
    img.alt = 'Question image';
    img.loading = 'lazy';
    img.onerror = () => img.remove();
    box.appendChild(img);
  }
}

function showOptions(q) {
  const container = $('options-container');
  container.innerHTML = '';
  const previous = userAnswers[String(q.id)];
  const answered = Boolean(previous);

  Object.entries(q.options).forEach(([key, value]) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'opt';
    btn.setAttribute('aria-label', `Option ${key}: ${String(value).replace(/<[^>]*>/g,'')}`);
    if (answered) {
      btn.classList.add('locked');
      if (normalizeKey(key) === normalizeKey(q.correct)) btn.classList.add('correct');
      if (normalizeKey(key) === normalizeKey(previous) && normalizeKey(previous) !== normalizeKey(q.correct)) btn.classList.add('wrong');
    } else {
      btn.addEventListener('click', () => selectOption(key, btn));
    }
    btn.innerHTML = `<span class="optkey">${key})</span><span>${value}</span>`;
    container.appendChild(btn);
  });
}

function loadQuestion() {
  if (!questions.length) return;
  if (reviewMode && reviewIndexes.length && !reviewIndexes.includes(currentIndex)) currentIndex = reviewIndexes[0];

  const q = questions[currentIndex];
  selectedOption = null;
  saveProgress();

  $('progress').textContent = reviewMode
    ? `Review • ${reviewIndexes.indexOf(currentIndex)+1} of ${reviewIndexes.length}`
    : `Question ${currentIndex+1} of ${questions.length}`;
  $('jump-input').value = currentIndex + 1;
  $('jump-input').max = questions.length;
  $('prev-btn').disabled = reviewMode ? reviewIndexes.indexOf(currentIndex) <= 0 : currentIndex === 0;

  createQuestionContent(q);
  showOptions(q);

  const answered = Boolean(userAnswers[String(q.id)]);
  $('submit-btn').classList.toggle('hidden', answered);
  $('submit-btn').disabled = true;
  $('explanation-box').classList.toggle('hidden', !answered);
  $('result-box').classList.add('hidden');

  if (answered) showExplanation(userAnswers[String(q.id)], q);
  updateScore();
  renderMath();
  window.scrollTo({top:0, behavior:'smooth'});
}

function selectOption(key, btn) {
  const q = questions[currentIndex];
  if (userAnswers[String(q.id)]) return;
  selectedOption = key;
  document.querySelectorAll('.opt').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  $('submit-btn').disabled = false;
}

function checkAnswer() {
  const q = questions[currentIndex];
  if (!selectedOption || userAnswers[String(q.id)]) return;
  userAnswers[String(q.id)] = selectedOption;
  saveProgress();
  loadQuestion();
}

function showExplanation(answerKey, q) {
  const correct = normalizeKey(answerKey) === normalizeKey(q.correct);
  $('result-status').className = `status ${correct ? 'correct-text' : 'wrong-text'}`;
  $('result-status').textContent = correct
    ? '✓ Correct!'
    : `✗ Incorrect • Correct answer: ${String(q.correct).toUpperCase()}`;

  $('explanation-text').innerHTML = q.explanation || 'No explanation provided.';
  const holder = $('explanation-images');
  holder.innerHTML = '';

  if (Array.isArray(q.explanation_images)) {
    q.explanation_images.forEach(src => {
      const img = document.createElement('img');
      img.src = src;
      img.alt = 'Explanation image';
      img.loading = 'lazy';
      img.onerror = () => img.remove();
      holder.appendChild(img);
    });
  }
  renderMath();
}

function nextQuestion() {
  if (reviewMode) {
    const pos = reviewIndexes.indexOf(currentIndex);
    if (pos >= 0 && pos < reviewIndexes.length - 1) {
      currentIndex = reviewIndexes[pos + 1]; loadQuestion();
    } else showResults();
    return;
  }
  if (currentIndex < questions.length - 1) {
    currentIndex++; loadQuestion();
  } else showResults();
}

function previousQuestion() {
  if (reviewMode) {
    const pos = reviewIndexes.indexOf(currentIndex);
    if (pos > 0) { currentIndex = reviewIndexes[pos-1]; loadQuestion(); }
  } else if (currentIndex > 0) {
    currentIndex--; loadQuestion();
  }
}

function jumpToQuestion() {
  const val = parseInt($('jump-input').value, 10);
  if (!Number.isInteger(val) || val < 1 || val > questions.length) {
    alert(`Please enter a number between 1 and ${questions.length}.`);
    return;
  }
  reviewMode = false;
  currentIndex = val - 1;
  loadQuestion();
}

function showResults() {
  const s = getStats();
  $('question-container').innerHTML = '';
  $('options-container').innerHTML = '';
  $('footer')?.classList.add('hidden');
  $('submit-btn').classList.add('hidden');
  $('prev-btn').classList.add('hidden');
  $('explanation-box').classList.add('hidden');
  $('result-box').classList.remove('hidden');
  $('progress').textContent = 'Test completed';
  $('result-score').textContent = `${Math.round((s.correct / questions.length) * 100)}%`;
  $('result-correct').textContent = s.correct;
  $('result-wrong').textContent = s.wrong;
  $('result-unanswered').textContent = s.unanswered;
  $('progress-bar').style.width = `${(s.answered / questions.length) * 100}%`;
}

function reviewWrong() {
  reviewIndexes = questions
    .map((q,i) => ({q,i}))
    .filter(x => userAnswers[String(x.q.id)] && normalizeKey(userAnswers[String(x.q.id)]) !== normalizeKey(x.q.correct))
    .map(x => x.i);

  if (!reviewIndexes.length) { alert('There are no wrong answers to review.'); return; }
  reviewMode = true;
  currentIndex = reviewIndexes[0];
  $('result-box').classList.add('hidden');
  $('submit-btn').classList.add('hidden');
  loadQuestion();
}

function restart() {
  if (!confirm('Restart and clear all saved answers?')) return;
  userAnswers = {}; currentIndex = 0; reviewMode = false; reviewIndexes = [];
  try { localStorage.removeItem(STORAGE_ANSWERS); localStorage.removeItem(STORAGE_INDEX); } catch(e){}
  $('result-box').classList.add('hidden');
  $('prev-btn').classList.remove('hidden');
  loadQuestion();
}

function resetProgress() { restart(); }

function showFatalError(err) {
  console.error(err);
  $('progress').textContent = 'Failed to load';
  $('score-display').textContent = '';
  $('options-container').innerHTML = '';
  $('submit-btn').classList.add('hidden');
  $('prev-btn').classList.add('hidden');
  $('explanation-box').classList.add('hidden');
  $('question-container').innerHTML =
    `<div class="error"><strong>Cannot load questions.</strong><br><br>${escapeHtml(err.message)}<br><br>
    <small>Expected file: <code>${escapeHtml(new URL('quiz_data.json', document.baseURI).href)}</code></small></div>`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function initApp() {
  try {
    const data = await loadJson();
    validateQuestions(data);
    questions = data;
    restoreProgress();
    loadQuestion();
  } catch(err) {
    showFatalError(err);
  }
}

$('jump-btn').addEventListener('click', jumpToQuestion);
$('jump-input').addEventListener('keydown', e => { if(e.key === 'Enter') jumpToQuestion(); });
$('reset-btn').addEventListener('click', resetProgress);
$('prev-btn').addEventListener('click', previousQuestion);
$('submit-btn').addEventListener('click', checkAnswer);
$('next-btn').addEventListener('click', nextQuestion);
$('review-wrong').addEventListener('click', reviewWrong);
$('restart-btn').addEventListener('click', restart);

document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea')) return;
  if (e.key === 'ArrowLeft') previousQuestion();
  if (e.key === 'ArrowRight' && !$('submit-btn').disabled) checkAnswer();
});

window.addEventListener('DOMContentLoaded', initApp);
</script>
</body>
</html>
